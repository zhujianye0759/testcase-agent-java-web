services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${TESTCASE_DB_NAME:-testcase_agent}
      MYSQL_USER: ${TESTCASE_DB_USERNAME:-testcase_agent}
      MYSQL_PASSWORD: ${TESTCASE_DB_PASSWORD:?Set TESTCASE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${TESTCASE_DB_ROOT_PASSWORD:?Set TESTCASE_DB_ROOT_PASSWORD in .env}
    ports:
      - "${TESTCASE_DB_PORT:-3307}:3306"
    volumes:
      - testcase-agent-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  testcase-agent-mysql-data:
