spring:
  application:
    name: testcase-agent-backend
  datasource:
    url: ${TESTCASE_DB_URL}
    username: ${TESTCASE_DB_USERNAME}
    password: ${TESTCASE_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration

app:
  artifacts:
    root: ${TESTCASE_ARTIFACT_ROOT:./var/artifacts}
  knowledge-agent:
    enabled: ${TESTCASE_KNOWLEDGE_AGENT_ENABLED:false}
    api-base-url: ${TESTCASE_KNOWLEDGE_AGENT_API_BASE_URL:}
    api-key: ${TESTCASE_KNOWLEDGE_AGENT_API_KEY:}
    timeout: ${TESTCASE_KNOWLEDGE_AGENT_TIMEOUT:5m}
  task-generation-profile:
    agent-id: ${TESTCASE_TASK_AGENT_ID:005876e2-a62f-41f3-8807-29bfd3f1e257}
    example-knowledge-base-id: ${TESTCASE_EXAMPLE_KNOWLEDGE_BASE_ID:1a2f0a98-546e-4cd0-a437-b17e866a21ac}
    example-good-document-ids: ${TESTCASE_EXAMPLE_GOOD_DOCUMENT_IDS:37c38fdc-3cb1-465d-b4b9-5226af6fd98d}
    example-bad-document-ids: ${TESTCASE_EXAMPLE_BAD_DOCUMENT_IDS:4071c86e-7037-4101-a57b-809bb109e536}
    catalog-cache-ttl: ${TESTCASE_SCOPE_CATALOG_CACHE_TTL:5m}
    knowledge-base-page-size: ${TESTCASE_SCOPE_KB_PAGE_SIZE:100}
    document-page-size: ${TESTCASE_SCOPE_DOCUMENT_PAGE_SIZE:20}
